name: Feature proposal
description: Propose a feature — and say what it replaces.
labels: ['proposal']
body:
  - type: markdown
    attributes:
      value: |
        Principle 5 of this project: **a new feature only lands by cutting
        another one.** A proposal that adds without removing is usually
        declined, so the second field below is the one that decides this issue.

        Please open this before writing a PR.
  - type: textarea
    id: feature
    attributes:
      label: What the feature is
      description: What it does, and what it is like to use.
    validations:
      required: true
  - type: textarea
    id: cut
    attributes:
      label: What it replaces
      description: >-
        Which existing feature, shortcut or piece of UI comes out to make room
        for it. "Nothing" is a valid answer, but it needs an argument.
    validations:
      required: true
  - type: textarea
    id: principles
    attributes:
      label: How it sits with the principles
      description: >-
        Nothing waits on the disk · saving is silent · no network, no telemetry,
        no extra permission · markdown is the editing format.
      placeholder: >-
        No new permission, no request, and it does not touch the boot path.
    validations:
      required: true
